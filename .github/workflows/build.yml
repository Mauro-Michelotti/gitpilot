name: Build

# Manual run (Actions → Build → Run workflow): packages are attached to the run as artifacts.
# Tag push (git tag v0.1.0 && git push --tags): also creates a draft GitHub Release with all packages.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4) → .app + .dmg. macos-latest is an arm64 runner.
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          # Linux x86_64 → .AppImage + .deb + .rpm. Oldest supported Ubuntu = oldest glibc,
          # so the packages also run on Ubuntu 22.04+ / Debian 12+ / Fedora 36+.
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Intel Macs, if ever needed:
          # - name: macOS x86_64
          #   runner: macos-15-intel
          #   target: x86_64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test core
        run: cargo test -p gitpilot-core

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Release only for tag pushes; manual runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: GitPilot ${{ github.ref_name }}
          releaseBody: |
            - **macOS (Apple Silicon)**: `.dmg`. App non notarizzata (firma ad-hoc): dopo averla copiata
              in Applicazioni, `xattr -dr com.apple.quarantine /Applications/GitPilot.app`
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE), `.AppImage` (qualsiasi distro)
          releaseDraft: true
          uploadWorkflowArtifacts: true
