[package]
name = "gitpilot"
description = "GitPilot – client Git con GitFlow, GitHub e GitLab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gitpilot-core = { path = "../crates/gitpilot-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
