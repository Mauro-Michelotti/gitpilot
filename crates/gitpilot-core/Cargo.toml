[package]
name = "gitpilot-core"
description = "Git, GitFlow and GitHub/GitLab logic for GitPilot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json"] }
keyring = "3.6"

# OS credential stores: GNOME Keyring/KWallet (Secret Service via pure-Rust D-Bus),
# macOS Keychain, Windows Credential Manager.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
